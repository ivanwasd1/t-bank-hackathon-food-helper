version: '3.8'

services:
  bentofy_backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://bentofy_user:bentofy_password@db:5432/bentofy_db
      - SECRET_KEY=your-secret-key-change-in-production
    depends_on:
      - db
    volumes:
      - ./backend:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: bentofy_db
      POSTGRES_USER: bentofy_user
      POSTGRES_PASSWORD: bentofy_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bentofy_user -d bentofy_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: .
    ports:
      - "3000:3000"
    depends_on:
      - bentofy_backend
    restart: unless-stopped

volumes:
  postgres_data:


version: '3.8'

services:
  backend:
    build: ./backend
    container_name: bentofy_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend # Mounts to subdirectory to match package structure
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app

  frontend:
    build: .
    container_name: bentofy_frontend
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      # Browser running on host machine accesses backend via localhost:8000
      - VITE_API_URL=http://localhost:8000
      - VITE_API_KEY=${VITE_API_KEY} 
    depends_on:
      - backend


services:
  backend:
    build: ./backend
    container_name: bentofy_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  frontend:
    build: .
    container_name: bentofy_frontend
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://backend:8000
      - VITE_API_KEY=${VITE_API_KEY:-default_key}
    depends_on:
      - backend
    restart: unless-stopped

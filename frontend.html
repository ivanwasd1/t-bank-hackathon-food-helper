<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анализатор продуктов питания</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .header {
            background: #2c3e50;
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.8;
            font-size: 1.1em;
        }

        .upload-area {
            padding: 40px;
            text-align: center;
            border-bottom: 1px solid #eee;
        }

        .file-input {
            display: none;
        }

        .upload-btn {
            display: inline-block;
            padding: 15px 30px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .upload-btn:hover {
            background: #2980b9;
            transform: translateY(-2px);
        }

        .preview {
            margin: 20px auto;
            max-width: 300px;
            display: none;
        }

        .preview img {
            max-width: 100%;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .analyze-btn {
            padding: 12px 25px;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            cursor: pointer;
            display: none;
            margin: 10px auto;
            transition: all 0.3s ease;
        }

        .analyze-btn:hover {
            background: #219a52;
        }

        .analyze-btn:disabled {
            background: #95a5a6;
            cursor: not-allowed;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results {
            padding: 30px;
            display: none;
        }

        .product-card {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
            display: flex;
            align-items: center;
            transition: all 0.3s ease;
        }

        .product-card:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .product-icon {
            font-size: 2em;
            margin-right: 15px;
        }

        .product-info {
            flex: 1;
        }

        .product-name {
            font-weight: bold;
            font-size: 1.2em;
            color: #2c3e50;
        }

        .product-details {
            color: #7f8c8d;
            margin-top: 5px;
        }

        .error {
            background: #e74c3c;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin: 20px;
            text-align: center;
            display: none;
        }

        .summary {
            background: #34495e;
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🍎 Анализатор продуктов</h1>
            <p>Загрузите фото продуктов и получите детальный анализ</p>
        </div>

        <div class="upload-area">
            <input type="file" id="fileInput" class="file-input" accept="image/*">
            <button class="upload-btn" onclick="document.getElementById('fileInput').click()">
                📸 Выберите фотографию
            </button>
            
            <div class="preview" id="preview">
                <img id="previewImage" src="" alt="Предпросмотр">
            </div>
            
            <button class="analyze-btn" id="analyzeBtn" onclick="analyzeImage()">
                🔍 Анализировать изображение
            </button>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Анализируем изображение...</p>
        </div>

        <div class="error" id="error"></div>

        <div class="results" id="results">
            <!-- Результаты будут здесь -->
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const preview = document.getElementById('preview');
        const previewImage = document.getElementById('previewImage');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const loading = document.getElementById('loading');
        const results = document.getElementById('results');
        const error = document.getElementById('error');

        let currentFile = null;

        // Обработчик выбора файла
        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                currentFile = file;
                
                // Показываем превью
                const reader = new FileReader();
                reader.onload = function(e) {
                    previewImage.src = e.target.result;
                    preview.style.display = 'block';
                    analyzeBtn.style.display = 'block';
                    results.style.display = 'none';
                    error.style.display = 'none';
                }
                reader.readAsDataURL(file);
            }
        });

        // Функция анализа изображения
     // Функция анализа изображения
async function analyzeImage() {
    if (!currentFile) return;

    // Показываем загрузку
    analyzeBtn.disabled = true;
    analyzeBtn.textContent = 'Анализ...';
    loading.style.display = 'block';
    results.style.display = 'none';
    error.style.display = 'none';

    try {
        const formData = new FormData();
        formData.append('image', currentFile);

        // 🔥 Пробуем разные URL
        const baseURL = 'http://127.0.0.1:5000';
        const endpoints = [
            `${baseURL}/analyze`,
            `http://localhost:5000/analyze`
        ];

        let response;
        let lastError;

        // Пробуем подключиться по разным адресам
        for (const url of endpoints) {
            try {
                console.log('Пробуем подключиться к:', url);
                response = await fetch(url, {
                    method: 'POST',
                    body: formData
                });
                
                if (response.ok) {
                    console.log('Успешное подключение к:', url);
                    break;
                }
            } catch (err) {
                lastError = err;
                console.log('Ошибка для', url, err);
                continue;
            }
        }

        if (!response) {
            throw new Error('Не удалось подключиться к серверу. Убедитесь, что сервер запущен на порту 5000.');
        }

        const data = await response.json();

        if (data.success) {
            displayResults(data.data);
        } else {
            showError(data.error || 'Произошла ошибка при анализе');
        }

    } catch (err) {
        showError('Ошибка: ' + err.message);
        console.error('Детали ошибки:', err);
    } finally {
        analyzeBtn.disabled = false;
        analyzeBtn.textContent = '🔍 Анализировать изображение';
        loading.style.display = 'none';
    }
}

        // Функция отображения результатов
        function displayResults(data) {
            results.innerHTML = '';
            
            // Добавляем summary
            if (data.analysis_summary) {
                const summaryDiv = document.createElement('div');
                summaryDiv.className = 'summary';
                summaryDiv.innerHTML = `
                    <h3>📋 Результаты анализа</h3>
                    <p>${data.analysis_summary}</p>
                    <p>Всего продуктов: ${data.total_products_count || 0}</p>
                `;
                results.appendChild(summaryDiv);
            }

            // Добавляем продукты
            if (data.products && data.products.length > 0) {
                data.products.forEach(product => {
                    const productCard = document.createElement('div');
                    productCard.className = 'product-card';
                    
                    const icon = getProductIcon(product.category);
                    
                    productCard.innerHTML = `
                        <div class="product-icon">${icon}</div>
                        <div class="product-info">
                            <div class="product-name">${product.name}</div>
                            <div class="product-details">
                                Количество: ${product.estimated_quantity} | 
                                Категория: ${product.category} |
                                Уверенность: ${product.confidence}
                            </div>
                        </div>
                    `;
                    
                    results.appendChild(productCard);
                });
            } else {
                results.innerHTML = '<div class="summary">🍽️ Продукты не обнаружены</div>';
            }
            
            results.style.display = 'block';
        }

        // Функция для иконок продуктов
        function getProductIcon(category) {
            const icons = {
                'фрукты': '🍎',
                'овощи': '🥦',
                'молочные': '🥛',
                'мясо': '🍖',
                'напитки': '🥤',
                'крупы': '🌾',
                'другое': '📦'
            };
            return icons[category] || '📦';
        }

        // Функция показа ошибок
        function showError(message) {
            error.textContent = message;
            error.style.display = 'block';
        }

        // Drag and drop функциональность
        document.addEventListener('DOMContentLoaded', function() {
            const uploadArea = document.querySelector('.upload-area');
            
            uploadArea.addEventListener('dragover', function(e) {
                e.preventDefault();
                uploadArea.style.background = '#f8f9fa';
            });
            
            uploadArea.addEventListener('dragleave', function(e) {
                e.preventDefault();
                uploadArea.style.background = '';
            });
            
            uploadArea.addEventListener('drop', function(e) {
                e.preventDefault();
                uploadArea.style.background = '';
                
                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    fileInput.files = files;
                    const event = new Event('change');
                    fileInput.dispatchEvent(event);
                }
            });
        });
    </script>
</body>
</html>
